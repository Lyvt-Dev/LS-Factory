name: Publish available release packages
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Verified release tag with a deployment payload branch
        required: true
        default: v0.4.4
  workflow_run:
    workflows: [Native builds and releases]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  publish-linux-now:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: deploy-payload/${{ inputs.tag }}
          fetch-depth: 0
      - name: Publish verified local Linux installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD^)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          cd deploy-payload
          sha256sum -c *.sha256
          cd ..
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" deploy-payload/* screenshots/*.png --clobber
          else
            gh release create "$RELEASE_TAG" deploy-payload/* screenshots/*.png --verify-tag --title "LS Factory $RELEASE_TAG" --notes-file OpenDAWForge/docs/RELEASE_NOTES.md --prerelease --latest=false
          fi
  complete-tested-platforms:
    if: github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.head_branch, 'v') && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Require all three platform build and installer jobs to pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" > jobs.json
          python - <<'PY'
          import json
          jobs=[j for j in json.load(open('jobs.json'))['jobs'] if j['name'].startswith('build (')]
          assert len(jobs)==3 and all(j['conclusion']=='success' for j in jobs), 'Platform validation incomplete; no packages published'
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
      - name: Verify immutable tag matches the tested source
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: dist
          merge-multiple: true
      - name: Complete the published milestone with tested platform installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* screenshots/*.png --clobber
          else
            gh release create "$RELEASE_TAG" dist/* screenshots/*.png --verify-tag --title "LS Factory $RELEASE_TAG" --notes-file OpenDAWForge/docs/RELEASE_NOTES.md --prerelease --latest=false
          fi
