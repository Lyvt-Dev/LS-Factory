name: Windows installer check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reuse published application for installer diagnostics
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory dist
          gh release download v0.2.0 --repo "${{ github.repository }}" --pattern '*windows-x64.zip' --dir dist
          $version = [regex]::Match((Get-Content OpenDAWForge/CMakeLists.txt -Raw), 'project\(LSFactory VERSION ([\d.]+)').Groups[1].Value
          Expand-Archive dist/LSFactory-0.2.0-windows-x64.zip stage
          Rename-Item stage/LSFactory-0.2.0-windows-x64 "LSFactory-$version-windows-x64"
          Compress-Archive "stage/LSFactory-$version-windows-x64" "dist/LSFactory-$version-windows-x64.zip"
      - name: Compile and exercise installer
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) { choco install innosetup --yes --no-progress }
          & OpenDAWForge/tools/package-windows.ps1 -OutputDirectory dist
